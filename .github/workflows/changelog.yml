name: Update Changelog

on:
  push:
    branches: [main]  # Triggers the workflow on every push to the main branch
  workflow_dispatch:      # Allows manual triggering from the GitHub UI
  schedule:
    - cron: '0 3 * * *' # Runs the workflow daily at 03:00 UTC

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure full history so push works

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (if any beyond node-fetch)
        run: npm install node-fetch@2

      - name: Generate changelog
        run: node home/changelog-gen.js
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Commit and push changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add home/changelog.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update changelog.json [auto]"
            git push
          fi