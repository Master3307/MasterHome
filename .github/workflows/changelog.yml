name: Update Changelog

on:
  push:
    branches:
      - main # Or the branch you want to trigger on

permissions:
  contents: write # Grant write permission to the GITHUB_TOKEN

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a suitable Node.js version

      - name: Run changelog generator script
        run: node ./home/changelog-gen.js # Ensure this path is correct relative to the repo root
        env:
          TOKEN: ${{ secrets.TOKEN }} # Set the TOKEN environment variable from GitHub secrets

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ./changelog.json # Ensure this path is correct relative to the repo root
          git commit -m "Update changelog.json" || echo "No changes to commit"
          git push
