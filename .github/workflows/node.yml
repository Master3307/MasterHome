# .github/workflows/update-changelog.yml

name: Run Node.js Scripts and Update Changelog
description: This workflow runs Node.js scripts to convert images, generate thumbnails, update the changelog, and update Supabase when changes are pushed to the main branch.

on:
  push:
    branches:
      - main # Or the branch you want to trigger on

permissions:
  contents: write # Grant write permission to the GITHUB_TOKEN

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hinzugefügt: Wichtig, um alle Commits für die GitHub API abrufen zu können.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a suitable Node.js version

      - name: Install general dependencies
        run: npm install # Install project dependencies, including 'sharp'
        working-directory: ./assets/ # Run npm install in the ./assets directory

      - name: Install ws
        run: npm install ws

      - name: Install Supabase client library
        run: npm install @supabase/supabase-js # Nur Supabase Client Bibliothek, da fetch nativ ist
        # Da `update-supabase-changelog.js` im Root-Verzeichnis ausgeführt wird,
        # sollten diese Abhängigkeiten im Root installiert werden, falls sie nicht schon global sind.
        # Wenn deine `package.json` im Root ist, kannst du `working-directory` hier weglassen oder auf '.' setzen.

      - name: Run WebP Converter script
        run: node ./assets/media/webp-converter.js # Ensure this path is correct relative to the repo root
        working-directory: . # Run script from repository root

      - name: Run Thumbnail Generator script
        run: node ./assets/media/generate-thumb.js # Ensure this path is correct relative to the repo root
        working-directory: . # Run script from repository root

      - name: Run Assets JSON Generator script
        run: node ./assets/generate-assets-json.js # Ensure this path is correct relative to the repo root
        working-directory: . # Run script from repository root

      # - name: Run changelog generator script
      #   run: node ./changelog-gen.js # Ensure this path is correct relative to the repo root
      #   working-directory: . # Run script from repository root
      #   env:
      #     TOKEN: ${{ secrets.TOKEN }} # Set the TOKEN environment variable from GitHub secrets

      # Hinzugefügt: Schritt zum Aktualisieren der Supabase Changelog-Tabelle
      - name: Run Supabase Changelog Update script
        run: node ./update-supabase-changelog.js # Stelle sicher, dass dieser Pfad korrekt ist
        working-directory: . # Führe das Skript vom Repository-Root aus
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }} # Dein GitHub PAT für Supabase-Zugriff
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} # Dein Supabase Service Role Key!

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ./changelog.json # Ensure this path is correct relative to the repo root
          # Füge auch das Supabase-Skript selbst zu `git add` hinzu, falls es sich geändert hat und gepusht werden soll.
          git commit -m "Update changelog.json [ci skip]" || echo "No changes to commit"
          git push
